name: Golden Path CI/CD - Filtro TI, QA & Produccion (GCP)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: us-central1
  REPOSITORY: stn-apps-repo
  CLOUDSQL_INSTANCE: stn-mysql

jobs:
  # =========================================================================
  # FASE 2: EL FILTRO DE TI (Tests, Clean Architecture y Escaneo de Secretos)
  # =========================================================================
  ti-gatekeeper-backend:
    name: "Filtro TI: Backend, Clean Arch & Secretos"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de Secretos Expuestos (Cero Exposición)
        run: |
          if grep -RInE "Password\s*=|User Id\s*=|AccountKey\s*=" backend/*.Api/appsettings*.json backend/*.Domain backend/*.Application 2>/dev/null; then
            echo "❌ ERROR DE SEGURIDAD: Se detectaron credenciales hardcodeadas en el código o appsettings."
            exit 1
          fi
          echo "✓ Verificación de Cero Exposición de Secretos superada."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ejecutar Tests Unitarios y de Clean Architecture (xUnit)
        run: dotnet test backend/ --configuration Release

  ti-gatekeeper-frontend:
    name: "Filtro TI: Frontend Tests & Build (React + TS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest tests
        working-directory: ./frontend
        run: npm test

      - name: Validate TypeScript & Production Build
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # FASE 3: DESPLIEGUE CONTINUO AUTOMÁTICO A QA (Google Cloud Run + WIF OIDC)
  # =========================================================================
  deploy-qa:
    name: "Fase 3: Deploy Automático a QA (Cloud Run)"
    needs: [ti-gatekeeper-backend, ti-gatekeeper-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: qa
      url: ${{ steps.deploy-web-qa.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation - QA)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_QA_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Immutable Backend & Frontend Images
        run: |
          API_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-api:${{ github.sha }}"
          WEB_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-web:${{ github.sha }}"
          docker build -t "$API_IMAGE" ./backend
          docker push "$API_IMAGE"
          docker build -t "$WEB_IMAGE" ./frontend
          docker push "$WEB_IMAGE"

      - name: Deploy Backend to Cloud Run QA
        id: deploy-api-qa
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ github.event.repository.name }}-api-qa
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-api:${{ github.sha }}
          env_vars: ASPNETCORE_ENVIRONMENT=QA
          secrets: ConnectionStrings__DefaultConnection=db-connection-string-qa:latest,AllowedClientIps=allowed-client-ips:latest
          flags: --allow-unauthenticated --port=8080 --service-account=cloudrun-runtime-qa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:${{ env.CLOUDSQL_INSTANCE }}

      - name: Deploy Frontend to Cloud Run QA
        id: deploy-web-qa
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ github.event.repository.name }}-web-qa
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-web:${{ github.sha }}
          env_vars: API_URL=${{ steps.deploy-api-qa.outputs.url }}
          secrets: AllowedClientIps=allowed-client-ips:latest
          flags: --allow-unauthenticated --port=8080 --service-account=cloudrun-runtime-qa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Configure Backend CORS for QA Frontend
        run: |
          gcloud run services update ${{ github.event.repository.name }}-api-qa \
            --region=${{ env.REGION }} \
            --update-env-vars="Cors__AllowedOrigins__0=${{ steps.deploy-web-qa.outputs.url }}" \
            --quiet

      - name: Publicar Enlaces Oficiales de QA
        run: |
          echo "### Entorno QA Desplegado (Google Cloud Run)" >> $GITHUB_STEP_SUMMARY
          echo "| Componente | Enlace Oficial QA | Imagen Inmutable (SHA) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Web (QA)** | ${{ steps.deploy-web-qa.outputs.url }} | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API (QA)** | ${{ steps.deploy-api-qa.outputs.url }} | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Healthcheck API (QA)** | ${{ steps.deploy-api-qa.outputs.url }}/health | \`db-connection-string-qa:latest\` |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 4: PASE A PRODUCCIÓN (Promoción Inmutable — 1 Clic Admin TI)
  # =========================================================================
  deploy-prod:
    name: "Fase 4: Pase a Producción (Aprobación TI)"
    needs: [ti-gatekeeper-backend, ti-gatekeeper-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == '888Leonidas888'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy-web-prod.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation - PROD)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_PROD_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run Production (Same QA Image)
        id: deploy-api-prod
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ github.event.repository.name }}-api-prod
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-api:${{ github.sha }}
          env_vars: ASPNETCORE_ENVIRONMENT=Production
          secrets: ConnectionStrings__DefaultConnection=db-connection-string-prod:latest,AllowedClientIps=allowed-client-ips:latest
          flags: --allow-unauthenticated --port=8080 --service-account=cloudrun-runtime-prod@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:${{ env.CLOUDSQL_INSTANCE }}

      - name: Deploy Frontend to Cloud Run Production (Same QA Image)
        id: deploy-web-prod
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ github.event.repository.name }}-web-prod
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ github.event.repository.name }}-web:${{ github.sha }}
          env_vars: API_URL=${{ steps.deploy-api-prod.outputs.url }}
          secrets: AllowedClientIps=allowed-client-ips:latest
          flags: --allow-unauthenticated --port=8080 --service-account=cloudrun-runtime-prod@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Configure Backend CORS for Production Frontend
        run: |
          gcloud run services update ${{ github.event.repository.name }}-api-prod \
            --region=${{ env.REGION }} \
            --update-env-vars="Cors__AllowedOrigins__0=${{ steps.deploy-web-prod.outputs.url }}" \
            --quiet

      - name: Publicar Enlaces Oficiales de Producción
        run: |
          echo "### Entorno Producción Desplegado (Google Cloud Run)" >> $GITHUB_STEP_SUMMARY
          echo "| Componente | Enlace Oficial Producción | Imagen Inmutable (SHA) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Web (PROD)** | ${{ steps.deploy-web-prod.outputs.url }} | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API (PROD)** | ${{ steps.deploy-api-prod.outputs.url }} | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Healthcheck API (PROD)** | ${{ steps.deploy-api-prod.outputs.url }}/health | \`db-connection-string-prod:latest\` |" >> $GITHUB_STEP_SUMMARY
